spring.application.name=vehicle-booking-system
spring.profiles.active=dev

security.rate-limit.login.capacity=10
security.rate-limit.login.refill-tokens=10
security.rate-limit.login.refill-duration=1m
security.rate-limit.register.capacity=5
security.rate-limit.register.refill-tokens=5
security.rate-limit.register.refill-duration=1m
security.rate-limit.phone-otp.capacity=3
security.rate-limit.phone-otp.refill-tokens=3
security.rate-limit.phone-otp.refill-duration=1m
security.rate-limit.bucket-ttl=30m
security.rate-limit.bucket-cleanup-interval=5m

booking.expiration.pending-payment-timeout=15m
booking.expiration.cleanup-interval=5m
# Thông báo đến hạn trả xe: mỗi giờ (giây phút giờ ngày tháng thứ)
booking.due-return.cron=0 0 * * * *
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=20260415.0001
spring.flyway.baseline-description=existing_schema_baseline
spring.flyway.validate-on-migrate=true

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=when-authorized

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:vehicle-booking/cars}

# PayOS (overridden in application-dev via .env)
payos.mode=${PAYOS_MODE:mock}
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payos.return-url=${PAYOS_RETURN_URL:http://localhost:8080/api/payments/payos/return}
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:8080/api/payments/payos/cancel}
payos.frontend-url=${PAYOS_FRONTEND_URL:http://localhost:49457/#/bookings}
payos.bank-bin=${PAYOS_BANK_BIN:970422}
payos.account-number=${PAYOS_ACCOUNT_NUMBER:}
payos.account-name=${PAYOS_ACCOUNT_NAME:GORENTO}

goong.api-key=${GOONG_API_KEY:}
ekyc.mode=${EKYC_MODE:local}
ekyc.local-service-url=${EKYC_LOCAL_URL:http://localhost:8001}
ekyc.storage-dir=${EKYC_STORAGE_DIR:uploads/ekyc}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Gemini AI (chatbot)
gemini.api-key=${GEMINI_API_KEY:}
